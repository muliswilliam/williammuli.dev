<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="fk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="960" height="580" fill="#fdfff4"/>
  <text x="480" y="48" font-size="20" font-weight="700" fill="#000000" text-anchor="middle">FOR UPDATE blocks child inserts. FOR NO KEY UPDATE does not.</text>

  <rect x="40" y="88" width="420" height="64" rx="8" fill="#000000"/>
  <text x="250" y="114" font-size="16" font-weight="700" fill="#fdfff4" text-anchor="middle">SELECT ... FOR UPDATE</text>
  <text x="250" y="137" font-size="12" fill="#D1D5DB" text-anchor="middle">on orders WHERE id = 42</text>

  <rect x="500" y="88" width="420" height="64" rx="8" fill="#fdfff4" stroke="#000000" stroke-width="2.5"/>
  <text x="710" y="114" font-size="16" font-weight="700" fill="#000000" text-anchor="middle">SELECT ... FOR NO KEY UPDATE</text>
  <text x="710" y="137" font-size="12" fill="#374151" text-anchor="middle">on orders WHERE id = 42</text>

  <rect x="80" y="180" width="340" height="66" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="250" y="207" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Transaction A locks order 42</text>
  <text x="250" y="229" font-size="12" fill="#374151" text-anchor="middle">holds FOR UPDATE until commit</text>

  <rect x="540" y="180" width="340" height="66" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="710" y="207" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Transaction A locks order 42</text>
  <text x="710" y="229" font-size="12" fill="#374151" text-anchor="middle">holds FOR NO KEY UPDATE until commit</text>

  <line x1="250" y1="252" x2="250" y2="294" stroke="#000000" stroke-width="2" marker-end="url(#fk-arrow)"/>
  <line x1="710" y1="252" x2="710" y2="294" stroke="#000000" stroke-width="2" marker-end="url(#fk-arrow)"/>

  <rect x="80" y="300" width="340" height="66" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="250" y="327" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Transaction B inserts an order_item</text>
  <text x="250" y="349" font-size="12" fill="#374151" text-anchor="middle">FK check needs FOR KEY SHARE on order 42</text>

  <rect x="540" y="300" width="340" height="66" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="710" y="327" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Transaction B inserts an order_item</text>
  <text x="710" y="349" font-size="12" fill="#374151" text-anchor="middle">FK check needs FOR KEY SHARE on order 42</text>

  <line x1="250" y1="372" x2="250" y2="414" stroke="#000000" stroke-width="2" marker-end="url(#fk-arrow)"/>
  <line x1="710" y1="372" x2="710" y2="414" stroke="#000000" stroke-width="2" marker-end="url(#fk-arrow)"/>

  <rect x="80" y="420" width="340" height="82" rx="8" fill="#000000"/>
  <text x="250" y="452" font-size="18" font-weight="700" fill="#fdfff4" text-anchor="middle">BLOCKED</text>
  <text x="250" y="480" font-size="11" fill="#D1D5DB" text-anchor="middle">KEY SHARE conflicts with FOR UPDATE</text>

  <rect x="540" y="420" width="340" height="82" rx="8" fill="#fdfff4" stroke="#000000" stroke-width="2.5"/>
  <text x="710" y="452" font-size="18" font-weight="700" fill="#000000" text-anchor="middle">PROCEEDS</text>
  <text x="710" y="480" font-size="11" fill="#374151" text-anchor="middle">KEY SHARE does not conflict with NO KEY UPDATE</text>

  <rect x="150" y="526" width="660" height="40" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="480" y="546" font-size="12" font-weight="600" fill="#374151" text-anchor="middle" dominant-baseline="middle">Only DELETE and key changes need FOR UPDATE. Default to FOR NO KEY UPDATE.</text>
</svg>
