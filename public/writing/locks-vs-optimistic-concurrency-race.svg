<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="800" fill="#fdfff4"/>

  <!-- lifelines -->
  <line x1="160" y1="94" x2="160" y2="780" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="800" y1="94" x2="800" y2="780" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- central row-state connector -->
  <line x1="480" y1="180" x2="480" y2="700" stroke="#D1D5DB" stroke-width="2"/>

  <!-- actor headers -->
  <rect x="50" y="30" width="220" height="64" rx="8" fill="#000000"/>
  <text x="160" y="62" font-size="22" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">Alice</text>

  <rect x="690" y="30" width="220" height="64" rx="8" fill="#fdfff4" stroke="#000000" stroke-width="2.5"/>
  <text x="800" y="62" font-size="22" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">Bob</text>

  <!-- step 1: Alice SELECT -->
  <circle cx="160" cy="180" r="15" fill="#000000"/>
  <text x="160" y="180" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">1</text>
  <line x1="177" y1="180" x2="354" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="268" y="163" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">SELECT A12</text>

  <rect x="360" y="145" width="240" height="70" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="480" y="170" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Seat A12</text>
  <text x="480" y="195" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">AVAILABLE</text>

  <!-- step 2: Bob SELECT -->
  <circle cx="800" cy="340" r="15" fill="#fdfff4" stroke="#000000" stroke-width="2"/>
  <text x="800" y="340" font-size="14" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">2</text>
  <line x1="783" y1="340" x2="606" y2="340" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="692" y="323" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">SELECT A12</text>

  <rect x="360" y="305" width="240" height="70" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="480" y="330" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Seat A12</text>
  <text x="480" y="355" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">AVAILABLE</text>

  <!-- step 3: Alice UPDATE -->
  <circle cx="160" cy="520" r="15" fill="#000000"/>
  <text x="160" y="520" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">3</text>
  <line x1="177" y1="520" x2="354" y2="520" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="268" y="503" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">UPDATE A12</text>

  <rect x="360" y="485" width="240" height="70" rx="8" fill="#000000"/>
  <text x="480" y="510" font-size="12" font-weight="600" fill="#D1D5DB" text-anchor="middle">Seat A12</text>
  <text x="480" y="535" font-size="15" font-weight="700" fill="#fdfff4" text-anchor="middle">RESERVED by Alice</text>

  <!-- overwrite marker -->
  <circle cx="480" cy="605" r="15" fill="#000000"/>
  <text x="480" y="606" font-size="15" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">&#10005;</text>

  <!-- step 4: Bob UPDATE -->
  <circle cx="800" cy="700" r="15" fill="#fdfff4" stroke="#000000" stroke-width="2"/>
  <text x="800" y="700" font-size="14" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">4</text>
  <line x1="783" y1="700" x2="606" y2="700" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="692" y="683" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">UPDATE A12</text>

  <rect x="360" y="665" width="240" height="70" rx="8" fill="#fdfff4" stroke="#000000" stroke-width="2.5"/>
  <text x="480" y="690" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Seat A12</text>
  <text x="480" y="715" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">RESERVED by Bob</text>

  <text x="480" y="762" font-size="12" font-style="italic" font-weight="600" fill="#6B7280" text-anchor="middle">overwrites Alice's reservation</text>
</svg>
