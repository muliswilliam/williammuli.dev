<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="retry-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="960" height="760" fill="#fdfff4"/>

  <text x="480" y="58" font-size="21" font-weight="700" fill="#000000" text-anchor="middle">Retry the decision, not the write</text>
  <text x="480" y="88" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">Bob's request after Alice has committed</text>

  <circle cx="110" cy="205" r="18" fill="#000000"/>
  <text x="110" y="205" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">1</text>
  <rect x="150" y="148" width="210" height="114" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="255" y="178" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Attempt 1</text>
  <text x="255" y="207" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">SERIALIZABLE</text>
  <text x="255" y="235" font-size="12" fill="#374151" text-anchor="middle">reads Alice ON</text>
  <line x1="365" y1="205" x2="430" y2="205" stroke="#000000" stroke-width="2" marker-end="url(#retry-arrow)"/>

  <circle cx="480" cy="205" r="18" fill="#fdfff4" stroke="#000000" stroke-width="2"/>
  <text x="480" y="205" font-size="14" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">2</text>
  <rect x="520" y="148" width="280" height="114" rx="8" fill="#fdfff4" stroke="#000000" stroke-width="2.5"/>
  <text x="660" y="178" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">SQLSTATE 40001</text>
  <text x="660" y="207" font-size="12" fill="#374151" text-anchor="middle">transaction is aborted</text>
  <text x="660" y="235" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">ROLLBACK</text>

  <line x1="660" y1="268" x2="660" y2="334" stroke="#000000" stroke-width="2" marker-end="url(#retry-arrow)"/>
  <rect x="555" y="342" width="210" height="72" rx="36" fill="#000000"/>
  <text x="660" y="371" font-size="12" font-weight="600" fill="#D1D5DB" text-anchor="middle">bounded jittered</text>
  <text x="660" y="395" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle">BACKOFF</text>

  <line x1="550" y1="378" x2="370" y2="378" stroke="#000000" stroke-width="2" marker-end="url(#retry-arrow)"/>

  <circle cx="320" cy="505" r="18" fill="#000000"/>
  <text x="320" y="505" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">3</text>
  <rect x="95" y="448" width="190" height="114" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="190" y="478" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Attempt 2</text>
  <text x="190" y="507" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">NEW TRANSACTION</text>
  <text x="190" y="535" font-size="12" fill="#374151" text-anchor="middle">fresh snapshot</text>
  <line x1="290" y1="505" x2="430" y2="505" stroke="#000000" stroke-width="2" marker-end="url(#retry-arrow)"/>

  <circle cx="480" cy="505" r="18" fill="#fdfff4" stroke="#000000" stroke-width="2"/>
  <text x="480" y="505" font-size="14" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">4</text>
  <rect x="520" y="448" width="240" height="114" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="640" y="478" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Re-read current state</text>
  <text x="640" y="507" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Alice is OFF</text>
  <text x="640" y="535" font-size="12" fill="#374151" text-anchor="middle">others on call: 0</text>

  <line x1="640" y1="568" x2="640" y2="622" stroke="#000000" stroke-width="2" marker-end="url(#retry-arrow)"/>
  <rect x="480" y="630" width="320" height="74" rx="8" fill="#000000"/>
  <text x="640" y="658" font-size="13" font-weight="700" fill="#fdfff4" text-anchor="middle">REJECT "go off call"</text>
  <text x="640" y="684" font-size="12" fill="#D1D5DB" text-anchor="middle">one person remains on call</text>

  <text x="480" y="738" font-size="12" font-style="italic" font-weight="600" fill="#6B7280" text-anchor="middle">the retry reaches a new business decision from current data</text>
</svg>
