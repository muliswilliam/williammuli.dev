<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="#fdfff4"/>

  <!-- lifelines -->
  <line x1="160" y1="94" x2="160" y2="540" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="800" y1="94" x2="800" y2="540" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- central row-state connector -->
  <line x1="480" y1="235" x2="480" y2="390" stroke="#D1D5DB" stroke-width="2"/>

  <!-- actor headers -->
  <rect x="50" y="30" width="220" height="64" rx="8" fill="#000000"/>
  <text x="160" y="62" font-size="22" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">Alice</text>

  <rect x="690" y="30" width="220" height="64" rx="8" fill="#fdfff4" stroke="#000000" stroke-width="2.5"/>
  <text x="800" y="62" font-size="22" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">Bob</text>

  <!-- step 1: Alice's conditional update matches and wins -->
  <circle cx="160" cy="200" r="15" fill="#000000"/>
  <text x="160" y="200" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">1</text>
  <line x1="177" y1="200" x2="354" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="268" y="182" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">UPDATE A12</text>
  <text x="268" y="222" font-size="11" fill="#6B7280" text-anchor="middle">WHERE status = AVAILABLE</text>

  <rect x="360" y="165" width="240" height="70" rx="8" fill="#000000"/>
  <text x="480" y="190" font-size="12" font-weight="600" fill="#D1D5DB" text-anchor="middle">Seat A12</text>
  <text x="480" y="213" font-size="15" font-weight="700" fill="#fdfff4" text-anchor="middle">RESERVED by Alice</text>

  <!-- step 2: Bob's identical update runs against the already-changed row -->
  <circle cx="800" cy="350" r="15" fill="#fdfff4" stroke="#000000" stroke-width="2"/>
  <text x="800" y="350" font-size="14" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">2</text>
  <line x1="783" y1="350" x2="500" y2="350" stroke="#000000" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="692" y="332" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">UPDATE A12</text>
  <text x="692" y="372" font-size="11" fill="#6B7280" text-anchor="middle">WHERE status = AVAILABLE</text>

  <!-- condition no longer matches -->
  <circle cx="480" cy="350" r="15" fill="#000000"/>
  <text x="480" y="351" font-size="15" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">&#10005;</text>

  <rect x="360" y="390" width="240" height="80" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="480" y="415" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Seat A12</text>
  <text x="480" y="438" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">still RESERVED by Alice</text>
  <text x="480" y="460" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle">0 rows returned to Bob</text>

  <text x="480" y="515" font-size="12" font-style="italic" fill="#6B7280" text-anchor="middle">Only the request whose WHERE clause still matches updates the row.</text>
</svg>
