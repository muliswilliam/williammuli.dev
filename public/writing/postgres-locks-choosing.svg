<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 950" width="960" height="950" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="pick-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="960" height="950" fill="#fdfff4"/>
  <text x="480" y="48" font-size="20" font-weight="700" fill="#000000" text-anchor="middle">Start from the invariant, then pick the narrowest lock</text>

  <!-- Q1 -->
  <rect x="285" y="88" width="390" height="76" rx="8" fill="#000000"/>
  <text x="480" y="119" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle">Is the invariant about rows</text>
  <text x="480" y="143" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle">that already exist?</text>

  <line x1="285" y1="126" x2="174" y2="126" stroke="#000000" stroke-width="2" marker-end="url(#pick-arrow)"/>
  <text x="228" y="110" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">YES</text>
  <rect x="30" y="78" width="140" height="96" rx="8" fill="#fdfff4" stroke="#000000" stroke-width="2.5"/>
  <text x="100" y="102" font-size="11" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">Row lock:</text>
  <text x="100" y="122" font-size="11" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">FOR NO KEY UPDATE</text>
  <text x="100" y="142" font-size="11" fill="#374151" text-anchor="middle" dominant-baseline="middle">FOR UPDATE only for</text>
  <text x="100" y="162" font-size="11" fill="#374151" text-anchor="middle" dominant-baseline="middle">delete/key change</text>

  <line x1="480" y1="170" x2="480" y2="246" stroke="#000000" stroke-width="2" marker-end="url(#pick-arrow)"/>
  <text x="500" y="213" font-size="12" font-weight="700" fill="#000000">NO</text>

  <!-- Q2 -->
  <rect x="285" y="254" width="390" height="76" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="480" y="285" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Is it about the table's shape:</text>
  <text x="480" y="309" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">schema, index, or rewrite?</text>

  <line x1="285" y1="292" x2="174" y2="292" stroke="#000000" stroke-width="2" marker-end="url(#pick-arrow)"/>
  <text x="228" y="276" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">YES</text>
  <rect x="30" y="244" width="140" height="96" rx="8" fill="#000000"/>
  <text x="100" y="268" font-size="11" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">DDL form with the</text>
  <text x="100" y="288" font-size="11" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">weakest lock</text>
  <text x="100" y="308" font-size="11" fill="#D1D5DB" text-anchor="middle" dominant-baseline="middle">lock_timeout</text>
  <text x="100" y="328" font-size="11" fill="#D1D5DB" text-anchor="middle" dominant-baseline="middle">and retry</text>

  <line x1="480" y1="336" x2="480" y2="412" stroke="#000000" stroke-width="2" marker-end="url(#pick-arrow)"/>
  <text x="500" y="379" font-size="12" font-weight="700" fill="#000000">NO</text>

  <!-- Q3 -->
  <rect x="285" y="420" width="390" height="76" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="480" y="451" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Does the protected thing</text>
  <text x="480" y="475" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">have no row at all?</text>

  <line x1="675" y1="458" x2="786" y2="458" stroke="#000000" stroke-width="2" marker-end="url(#pick-arrow)"/>
  <text x="732" y="442" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">YES</text>
  <rect x="790" y="410" width="140" height="96" rx="8" fill="#fdfff4" stroke="#000000" stroke-width="2.5"/>
  <text x="860" y="434" font-size="11" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">Advisory lock</text>
  <text x="860" y="454" font-size="11" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">transaction scope</text>
  <text x="860" y="474" font-size="11" fill="#374151" text-anchor="middle" dominant-baseline="middle">try variant when</text>
  <text x="860" y="494" font-size="11" fill="#374151" text-anchor="middle" dominant-baseline="middle">loser should skip</text>

  <line x1="480" y1="502" x2="480" y2="578" stroke="#000000" stroke-width="2" marker-end="url(#pick-arrow)"/>
  <text x="500" y="545" font-size="12" font-weight="700" fill="#000000">NO</text>

  <!-- Q4 -->
  <rect x="285" y="586" width="390" height="76" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="480" y="617" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Is it a rule over a set of rows</text>
  <text x="480" y="641" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">that changes?</text>

  <line x1="675" y1="624" x2="786" y2="624" stroke="#000000" stroke-width="2" marker-end="url(#pick-arrow)"/>
  <text x="732" y="608" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">YES</text>
  <rect x="790" y="576" width="140" height="96" rx="8" fill="#000000"/>
  <text x="860" y="600" font-size="11" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">SERIALIZABLE</text>
  <text x="860" y="620" font-size="11" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">with retries</text>
  <text x="860" y="640" font-size="11" fill="#D1D5DB" text-anchor="middle" dominant-baseline="middle">or lock a parent</text>
  <text x="860" y="660" font-size="11" fill="#D1D5DB" text-anchor="middle" dominant-baseline="middle">row for the set</text>

  <line x1="480" y1="668" x2="480" y2="744" stroke="#000000" stroke-width="2" marker-end="url(#pick-arrow)"/>
  <text x="500" y="711" font-size="12" font-weight="700" fill="#000000">NO</text>

  <!-- final -->
  <rect x="285" y="752" width="390" height="76" rx="8" fill="#000000"/>
  <text x="480" y="783" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle">Revisit the model: a unique constraint</text>
  <text x="480" y="807" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle">or a row that stands for the thing</text>

  <rect x="150" y="866" width="660" height="54" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="480" y="893" font-size="12" font-weight="600" fill="#374151" text-anchor="middle" dominant-baseline="middle">Then choose the wait policy: wait, lock_timeout, NOWAIT, or SKIP LOCKED</text>
</svg>
