<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="choice-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="960" height="800" fill="#fdfff4"/>
  <text x="480" y="48" font-size="20" font-weight="700" fill="#000000" text-anchor="middle">Choose the narrowest solution that preserves the rule</text>

  <rect x="285" y="88" width="390" height="76" rx="8" fill="#000000"/>
  <text x="480" y="119" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle">Can the rule be checked and changed</text>
  <text x="480" y="143" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle">in one database statement?</text>

  <line x1="285" y1="126" x2="164" y2="126" stroke="#000000" stroke-width="2" marker-end="url(#choice-arrow)"/>
  <text x="222" y="110" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">YES</text>
  <rect x="40" y="82" width="120" height="88" rx="8" fill="#fdfff4" stroke="#000000" stroke-width="2.5"/>
  <text x="100" y="111" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">Conditional</text>
  <text x="100" y="133" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">UPDATE or</text>
  <text x="100" y="155" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">constraint</text>

  <line x1="480" y1="170" x2="480" y2="246" stroke="#000000" stroke-width="2" marker-end="url(#choice-arrow)"/>
  <text x="500" y="213" font-size="12" font-weight="700" fill="#000000">NO</text>

  <rect x="285" y="254" width="390" height="76" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="480" y="285" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Can every writer lock the same small,</text>
  <text x="480" y="309" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">known set of rows before deciding?</text>

  <line x1="285" y1="292" x2="164" y2="292" stroke="#000000" stroke-width="2" marker-end="url(#choice-arrow)"/>
  <text x="222" y="276" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">YES</text>
  <rect x="40" y="248" width="120" height="88" rx="8" fill="#000000"/>
  <text x="100" y="280" font-size="12" font-weight="700" fill="#fdfff4" text-anchor="middle">SELECT</text>
  <text x="100" y="302" font-size="12" font-weight="700" fill="#fdfff4" text-anchor="middle">FOR UPDATE</text>
  <text x="100" y="324" font-size="11" fill="#D1D5DB" text-anchor="middle">short transaction</text>

  <line x1="480" y1="336" x2="480" y2="412" stroke="#000000" stroke-width="2" marker-end="url(#choice-arrow)"/>
  <text x="500" y="379" font-size="12" font-weight="700" fill="#000000">NO</text>

  <rect x="285" y="420" width="390" height="76" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="480" y="451" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Does the rule depend on a changing set</text>
  <text x="480" y="475" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">of rows or several tables?</text>

  <line x1="675" y1="458" x2="796" y2="458" stroke="#000000" stroke-width="2" marker-end="url(#choice-arrow)"/>
  <text x="736" y="442" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">YES</text>
  <rect x="800" y="414" width="120" height="88" rx="8" fill="#fdfff4" stroke="#000000" stroke-width="2.5"/>
  <text x="860" y="446" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">SERIALIZABLE</text>
  <text x="860" y="468" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">with bounded</text>
  <text x="860" y="490" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">retries</text>

  <line x1="480" y1="502" x2="480" y2="578" stroke="#000000" stroke-width="2" marker-end="url(#choice-arrow)"/>
  <text x="500" y="545" font-size="12" font-weight="700" fill="#000000">NO</text>

  <rect x="285" y="586" width="390" height="76" rx="8" fill="#000000"/>
  <text x="480" y="617" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle">Revisit the data model and identify</text>
  <text x="480" y="641" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle">the exact rows that need protection</text>

  <rect x="150" y="708" width="660" height="54" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="480" y="736" font-size="12" font-weight="600" fill="#374151" text-anchor="middle" dominant-baseline="middle">This is a starting point, not a substitute for testing the real concurrent workload</text>
</svg>
