<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="960" height="900" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="serial-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect width="960" height="900" fill="#fdfff4"/>

  <line x1="160" y1="94" x2="160" y2="872" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="800" y1="94" x2="800" y2="872" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="480" y1="152" x2="480" y2="814" stroke="#D1D5DB" stroke-width="2"/>

  <rect x="50" y="30" width="220" height="64" rx="8" fill="#000000"/>
  <text x="160" y="62" font-size="22" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">Alice</text>

  <rect x="690" y="30" width="220" height="64" rx="8" fill="#fdfff4" stroke="#000000" stroke-width="2.5"/>
  <text x="800" y="62" font-size="22" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">Bob</text>

  <rect x="340" y="122" width="280" height="62" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="480" y="147" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Starting state</text>
  <text x="480" y="169" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Alice ON  |  Bob ON</text>

  <circle cx="160" cy="260" r="15" fill="#000000"/>
  <text x="160" y="260" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">1</text>
  <line x1="177" y1="260" x2="354" y2="260" stroke="#000000" stroke-width="2" marker-end="url(#serial-arrow)"/>
  <text x="267" y="240" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">BEGIN SERIALIZABLE</text>
  <rect x="360" y="222" width="240" height="76" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="480" y="249" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Alice reads</text>
  <text x="480" y="277" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Bob on call: 1</text>

  <circle cx="800" cy="414" r="15" fill="#fdfff4" stroke="#000000" stroke-width="2"/>
  <text x="800" y="414" font-size="14" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">2</text>
  <line x1="783" y1="414" x2="606" y2="414" stroke="#000000" stroke-width="2" marker-end="url(#serial-arrow)"/>
  <text x="693" y="394" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">BEGIN SERIALIZABLE</text>
  <rect x="360" y="376" width="240" height="76" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="480" y="403" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Bob reads</text>
  <text x="480" y="431" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Alice on call: 1</text>

  <circle cx="160" cy="590" r="15" fill="#000000"/>
  <text x="160" y="590" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">3</text>
  <line x1="177" y1="590" x2="354" y2="590" stroke="#000000" stroke-width="2" marker-end="url(#serial-arrow)"/>
  <text x="267" y="570" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">UPDATE Alice; COMMIT</text>
  <rect x="360" y="552" width="240" height="76" rx="8" fill="#000000"/>
  <text x="480" y="579" font-size="12" font-weight="600" fill="#D1D5DB" text-anchor="middle">Committed state</text>
  <text x="480" y="607" font-size="15" font-weight="700" fill="#fdfff4" text-anchor="middle">Alice OFF  |  Bob ON</text>

  <circle cx="800" cy="760" r="15" fill="#fdfff4" stroke="#000000" stroke-width="2"/>
  <text x="800" y="760" font-size="14" font-weight="700" fill="#000000" text-anchor="middle" dominant-baseline="middle">4</text>
  <line x1="783" y1="760" x2="626" y2="760" stroke="#000000" stroke-width="2" marker-end="url(#serial-arrow)"/>
  <text x="705" y="740" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">UPDATE Bob; COMMIT</text>

  <rect x="360" y="710" width="250" height="100" rx="8" fill="#fdfff4" stroke="#000000" stroke-width="2.5"/>
  <text x="485" y="741" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">SQLSTATE 40001</text>
  <text x="485" y="766" font-size="11" fill="#374151" text-anchor="middle">serialization failure</text>
  <text x="485" y="790" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">Bob ROLLS BACK</text>

  <rect x="360" y="832" width="240" height="46" rx="8" fill="#000000"/>
  <text x="480" y="856" font-size="14" font-weight="700" fill="#fdfff4" text-anchor="middle" dominant-baseline="middle">1 person remains on call</text>
</svg>
